services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
      POSTGRES_DB: shelf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - shelf-postgres:/var/lib/postgresql/data

volumes:
  shelf-postgres:
